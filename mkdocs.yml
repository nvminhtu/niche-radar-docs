site_name: Niche Radar
site_description: Gõ một niche — biết keyword nào còn trống, đối thủ yếu ở đâu, nhu cầu lên hay xuống
site_url: https://nvminhtu.github.io/niche-radar-docs/
repo_url: https://github.com/nvminhtu/niche-radar-docs
docs_dir: docs
site_dir: site
theme:
  name: material
  language: vi
  font:
    text: Figtree
    code: JetBrains Mono
  logo: images/shotmatic-wordmark-light.png
  favicon: images/shotmatic-favicon-32.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Chế độ tối }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Chế độ sáng }
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
hooks:
  - hooks/nav_status.py
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/setup-detect.js
  - javascripts/nav-strike.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }
