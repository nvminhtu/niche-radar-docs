          - Phase 2 · App Store: phase-2-app-store.md
          - Phase 3 · Google Trends: phase-3-google-trends.md
          - Phase 4 · Feature Gap Matrix: phase-4-feature-gap.md
          - Phase 5 · Verified Sites: phase-5-verified.md
          - Phase 6 · Tích hợp AI (Web): phase-6-ai-web.md
          - Phase 7 · Review + Validate: phase-7-review-validate.md
          - Phase 8 · Local App: phase-8-local-app.md
          - Phase 9 · Small Features Update: phase-9-small-features.md
          - Phase 10 · UI / UX: phase-10-ui-ux.md
          - Phase 11 · Account + Flow: phase-11-account.md
      - Version 2 (sau MVP · Nguồn mới + AI):
          - Phase 12 · YouTube Search: phase-12-youtube-search.md
          - Phase 13 · YouTube Research (AI): phase-13-youtube-ai.md
          - Phase 14 · Amazon Search: phase-14-amazon-search.md
